ServerName localhost

<IfModule mpm_peruser_module>
    ServerLimit          10
    MinSpareProcessors   1
    MaxSpareProcessors   3
    MaxClients           10
    ExpireTimeout        5
    IdleTimeout          300
</IfModule>

Processor alpha alpha
<Processor alpha>
    User alpha
    Group alpha
</Processor>

Processor bravo bravo
<Processor bravo>
    User bravo
    Group bravo
</Processor>

Processor charlie charlie
<Processor charlie>
    User charlie
    Group charlie
</Processor>

<VirtualHost *:80>
    ServerName alpha.test
    DocumentRoot /var/www/alpha.test

    <Directory /var/www/alpha.test>
        Require all granted
    </Directory>

    <IfModule peruser.c>
        ServerEnvironment alpha
    </IfModule>
</VirtualHost>

<VirtualHost *:80>
    ServerName bravo.test
    DocumentRoot /var/www/bravo.test

    <Directory /var/www/bravo.test>
        Require all granted
    </Directory>

    <IfModule peruser.c>
        ServerEnvironment bravo
    </IfModule>
</VirtualHost>

<VirtualHost *:80>
    ServerName charlie.test
    DocumentRoot /var/www/charlie.test

    <Directory /var/www/charlie.test>
        Require all granted
    </Directory>

    <IfModule peruser.c>
        ServerEnvironment charlie
    </IfModule>
</VirtualHost>

# Local-test-only status page (peruser's mod_status patch adds a
# "Processors statistics" table showing each Processor's active/idle
# workers). "Require all granted" instead of upstream's default
# "Require local" since requests arrive via the Docker bridge, not
# loopback -- this box isn't exposed beyond 127.0.0.1:8090 on the host.
ExtendedStatus On
<Location "/server-status">
    SetHandler server-status
    Require all granted
</Location>
