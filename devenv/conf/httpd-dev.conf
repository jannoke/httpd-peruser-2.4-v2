# Minimal config for `devenv/devenv.sh run`. ServerRoot is the install
# prefix (passed with -d); DEVENV_DIR is defined on the command line.
# Logs and the pid file go to /tmp inside the container so no root-owned
# files land in the repo.

LoadModule unixd_module       modules/mod_unixd.so
# peruser needs mod_unixd loaded first (same order as 00-base before 00-mpm)
LoadModule mpm_peruser_module modules/mod_mpm_peruser.so
LoadModule authz_core_module  modules/mod_authz_core.so
LoadModule mime_module        modules/mod_mime.so
LoadModule dir_module         modules/mod_dir.so
LoadModule log_config_module  modules/mod_log_config.so
LoadModule status_module      modules/mod_status.so

ServerName localhost
User daemon
Group daemon
Listen 8080

PidFile   /tmp/devenv-httpd/httpd.pid
ErrorLog  /tmp/devenv-httpd/logs/error_log
LogLevel  info
LogFormat "%h %{Host}i \"%r\" %>s %b pid=%P" dev
CustomLog /tmp/devenv-httpd/logs/access_log dev
CoreDumpDirectory /tmp/devenv-httpd

TypesConfig conf/mime.types
DirectoryIndex index.html

<IfModule mpm_peruser_module>
    ServerLimit          10
    MinSpareProcessors   1
    MaxSpareProcessors   3
    MaxClients           10
    ExpireTimeout        5
    IdleTimeout          300
</IfModule>

Processor alpha alpha
<Processor alpha>
    User alpha
    Group alpha
</Processor>

Processor bravo bravo
<Processor bravo>
    User bravo
    Group bravo
</Processor>

<Directory />
    AllowOverride None
    Require all denied
</Directory>

<VirtualHost *:8080>
    ServerName alpha.test
    DocumentRoot ${DEVENV_DIR}/www/alpha.test
    <Directory ${DEVENV_DIR}/www/alpha.test>
        Require all granted
    </Directory>
    <IfModule peruser.c>
        ServerEnvironment alpha
    </IfModule>
</VirtualHost>

<VirtualHost *:8080>
    ServerName bravo.test
    DocumentRoot ${DEVENV_DIR}/www/bravo.test
    <Directory ${DEVENV_DIR}/www/bravo.test>
        Require all granted
    </Directory>
    <IfModule peruser.c>
        ServerEnvironment bravo
    </IfModule>
</VirtualHost>
